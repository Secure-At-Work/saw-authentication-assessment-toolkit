name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    # This workstation's local WDAC/ConstrainedLanguage policy blocks Pester's own
    # Add-Type-based internals (see docs/powershell-coding-notes.md and tests/README.md),
    # so these tests are only ever actually executed here, in CI.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Pester and PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck -Scope CurrentUser

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer -Force
          $results = Invoke-ScriptAnalyzer -Path ./src -Recurse -Severity Warning, Error -Settings ./PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results.Count -gt 0) {
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s)."
            exit 1
          }

      - name: Run Pester tests
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5.0 -Force

          $config = New-PesterConfiguration
          $config.Run.Path = './tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.CodeCoverage.Enabled = $true
          $config.CodeCoverage.Path = @(
            './src/collector/*.ps1',
            './src/rules/*.ps1',
            './src/dashboard/*.ps1',
            './src/Invoke-SAWGraphRequest.ps1',
            './src/Test-SAWPowerShellVersion.ps1',
            './src/Connect-SAWGraph.ps1'
          )
          $config.CodeCoverage.OutputFormat = 'JaCoCo'
          $config.CodeCoverage.OutputPath = './coverage.xml'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.TestResult.OutputPath = './testResults.xml'

          Invoke-Pester -Configuration $config

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            testResults.xml
            coverage.xml
